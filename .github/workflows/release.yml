name: Release Package

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-go@v2
      - uses: actions/checkout@v2
      - name: Set env
        run: echo $("RELEASE_VERSION=" + "${{ github.ref }}".Substring(10)) >> $env:GITHUB_ENV
      - run: go get github.com/akavel/rsrc
      - name: Build project
        run: /bin/bash build.sh -v "${{ env.RELEASE_VERSION }}"
        shell: bash
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: Release ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
      - name: Upload Release Asset (exe)
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/clipboard-online.exe
          asset_name: clipboard-online.exe
          asset_content_type: application/exe
      - name: Upload Release Asset (app.ico)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app.ico
          asset_name: app.ico
          asset_content_type: image/x-icon
      - name: Upload Release Asset (icon.png)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./icon.png
          asset_name: icon.png
          asset_content_type: image/png
