name: Release Package

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-go@v2
      - uses: actions/checkout@v2
      - name: Set env
        run: echo $("RELEASE_VERSION=" + "${{ github.ref_name }}".Substring(1)) >> $env:GITHUB_ENV
      - run: go get github.com/akavel/rsrc
      - name: Build project
        run: /bin/bash build.sh -v "${{ env.RELEASE_VERSION }}"
        shell: bash
      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## clipboard-online ${{ github.ref_name }}

            Windows / iOS 剪切板同步工具。

            ### 包含文件
            - `clipboard-online.exe`：主程序
            - `app.ico`：程序图标
            - `icon.png`：通知左侧图标
          files: |
            ./release/clipboard-online.exe
            ./app.ico
            ./icon.png
